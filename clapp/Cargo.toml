[package]
name = "gridcraft-clapp"
version = "0.1.0"
edition = "2021"
description = "GridCraft as a clapp: the launcher Clatch starts, and the agent's CLI."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "gridcraft"
path = "src/main.rs"

# Its own workspace: the repository root is upstream's, and this crate is not one of its members.
[workspace]

[dependencies]
# No `icon`: this process has no window of its own; the app shows its own Dock tile.
clappkit = { path = "../clappkit", default-features = false, features = ["standalone"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs"] }
# preserve_order: answers print in the order the window wrote them.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
getrandom = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
